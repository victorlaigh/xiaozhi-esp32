  <text x="190" y="458" fill="#f0f3f7" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="17" font-weight="600">01  深色极简</text>
  <text x="190" y="480" fill="#9da8b7" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12">大字时间 · 克制天气 · 清爽易读</text>
  <text x="540" y="458" fill="#f0f3f7" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="17" font-weight="600">02  天气氛围</text>
